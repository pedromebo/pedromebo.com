<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="840" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0d24" />
      <stop offset="100%" stop-color="#111638" />
    </linearGradient>
    <linearGradient id="accent3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#596dff" />
      <stop offset="100%" stop-color="#ff2e93" />
    </linearGradient>
    <clipPath id="cardClip3">
      <rect width="840" height="360" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip3)">
    <rect width="840" height="360" rx="16" fill="url(#bg3)" />
    <rect x="0" y="0" width="840" height="4" fill="url(#accent3)" />

    <!-- Header -->
    <circle cx="28" cy="26" r="6" fill="#ff2e93" />
    <circle cx="48" cy="26" r="6" fill="#f59e0b" />
    <circle cx="68" cy="26" r="6" fill="#00f5d4" />
    <text x="92" y="30" fill="#b6bddb" font-family="monospace" font-size="13" font-weight="bold">GitHub — Create a new repository</text>
    <line x1="0" y1="48" x2="840" y2="48" stroke="#262f6e" stroke-width="1" />

    <!-- Owner / Repo Name Input -->
    <text x="48" y="84" fill="#b6bddb" font-family="sans-serif" font-size="13" font-weight="bold">Owner</text>
    <rect x="48" y="94" width="180" height="40" rx="8" fill="#070919" stroke="#262f6e" stroke-width="1.5" />
    <text x="66" y="119" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">pedromebo ▾</text>

    <text x="244" y="120" fill="#b6bddb" font-family="monospace" font-size="22" font-weight="bold">/</text>

    <text x="268" y="84" fill="#00f5d4" font-family="sans-serif" font-size="13" font-weight="bold">Repository name *</text>
    <rect x="268" y="94" width="260" height="40" rx="8" fill="#070919" stroke="#00f5d4" stroke-width="2" />
    <text x="286" y="119" fill="#00f5d4" font-family="monospace" font-size="14" font-weight="bold">pedromebo</text>

    <!-- Special Repo Banner -->
    <rect x="48" y="150" width="744" height="54" rx="10" fill="#16224f" stroke="#00f5d4" stroke-width="1.5" />
    <text x="420" y="182" text-anchor="middle" fill="#00f5d4" font-family="sans-serif" font-size="13" font-weight="bold">★ pedromebo/pedromebo is a ✨special✨ repository that adds a README.md to your GitHub profile.</text>

    <!-- Public Check -->
    <circle cx="62" cy="236" r="8" stroke="#00f5d4" stroke-width="2" fill="#0a0d24" />
    <circle cx="62" cy="236" r="4" fill="#00f5d4" />
    <text x="82" y="241" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Public</text>
    <text x="136" y="241" fill="#b6bddb" font-family="sans-serif" font-size="13">— Make sure it’s public so it appears on your profile</text>

    <!-- Add README Check -->
    <rect x="54" y="268" width="16" height="16" rx="4" fill="#00f5d4" />
    <path d="M58 276 L61 279 L67 272" stroke="#0a0d24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="82" y="281" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Add a README file</text>
    <text x="218" y="281" fill="#b6bddb" font-family="sans-serif" font-size="13">— Initialize this repository with a README.md</text>

    <!-- Create Button -->
    <rect x="620" y="302" width="172" height="38" rx="8" fill="#00f5d4" />
    <text x="706" y="326" text-anchor="middle" fill="#0a0d24" font-family="monospace" font-size="13" font-weight="bold">Create repository</text>
  </g>
  <rect x="1" y="1" width="838" height="358" rx="15" stroke="#262f6e" stroke-width="2" />
</svg>
