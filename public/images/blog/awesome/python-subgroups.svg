<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="840" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0d24" />
      <stop offset="100%" stop-color="#111638" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#596dff" />
      <stop offset="100%" stop-color="#ff2e93" />
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="840" height="340" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="840" height="340" rx="16" fill="url(#bg)" />
    <rect x="0" y="0" width="840" height="4" fill="url(#accent)" />

    <!-- Window Header -->
    <circle cx="28" cy="26" r="6" fill="#ff2e93" />
    <circle cx="48" cy="26" r="6" fill="#f59e0b" />
    <circle cx="68" cy="26" r="6" fill="#00f5d4" />
    <text x="92" y="30" fill="#b6bddb" font-family="monospace" font-size="13" font-weight="bold">sindresorhus / awesome — Programming Languages &gt; Python</text>
    <line x1="0" y1="48" x2="840" y2="48" stroke="#262f6e" stroke-width="1" />

    <!-- Content Tree -->
    <text x="36" y="82" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">Programming Languages</text>

    <!-- Python Main Node -->
    <rect x="36" y="98" width="768" height="214" rx="12" fill="#070919" stroke="#262f6e" stroke-width="1.5" />
    <circle cx="62" cy="126" r="5" fill="#00f5d4" />
    <text x="78" y="131" fill="#00f5d4" font-family="monospace" font-size="14" font-weight="bold">Python</text>
    <text x="142" y="131" fill="#b6bddb" font-family="sans-serif" font-size="13">— General-purpose language designed for readability (vinta/awesome-python)</text>

    <!-- Sub-branches -->
    <line x1="62" y1="138" x2="62" y2="278" stroke="#596dff" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Branch 1 -->
    <line x1="62" y1="168" x2="90" y2="168" stroke="#596dff" stroke-width="2" />
    <rect x="96" y="150" width="680" height="34" rx="8" fill="#111638" stroke="#262f6e" />
    <text x="112" y="172" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">Asyncio</text>
    <text x="190" y="172" fill="#b6bddb" font-family="sans-serif" font-size="12.5">— Asynchronous I/O in Python 3 (timofurrer/awesome-asyncio)</text>

    <!-- Branch 2 -->
    <line x1="62" y1="216" x2="90" y2="216" stroke="#596dff" stroke-width="2" />
    <rect x="96" y="198" width="680" height="34" rx="8" fill="#111638" stroke="#262f6e" />
    <text x="112" y="220" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">Scientific Audio</text>
    <text x="255" y="220" fill="#b6bddb" font-family="sans-serif" font-size="12.5">— Audio &amp; music research (faroit/awesome-python-scientific-audio)</text>

    <!-- Branch 3 (Highlighted Data Science) -->
    <line x1="62" y1="266" x2="90" y2="266" stroke="#00f5d4" stroke-width="2" />
    <rect x="96" y="246" width="680" height="40" rx="8" fill="#16224f" stroke="#00f5d4" stroke-width="2" />
    <text x="112" y="271" fill="#00f5d4" font-family="monospace" font-size="13.5" font-weight="bold">★ Data Science</text>
    <text x="236" y="271" fill="#ffffff" font-family="sans-serif" font-size="12.5">— Data analysis &amp; Machine Learning (krzjoa/awesome-python-data-science)</text>
    <rect x="688" y="255" width="74" height="22" rx="6" fill="#00f5d4" />
    <text x="703" y="270" fill="#0a0d24" font-family="monospace" font-size="11" font-weight="bold">SELECT</text>
  </g>
  <rect x="1" y="1" width="838" height="338" rx="15" stroke="#262f6e" stroke-width="2" />
</svg>
